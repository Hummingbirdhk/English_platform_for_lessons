name: Format Figma MVP branch

on:
  push:
    branches:
      - feature/figma-mvp-design

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/materials/MaterialsPage.tsx src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style: format Figma MVP implementation"
            git push
          fi
