name: Product Structure TDD

on:
  push:
    branches:
      - feature/product-structure

permissions:
  contents: read

jobs:
  product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npm test -- --run
          tests/content/content-validation.test.ts
          tests/app/app-shell.test.tsx
          tests/entities/material/MaterialRenderer.test.tsx
          tests/entities/lesson/LessonRenderer.test.tsx
          tests/pages/materials/MaterialsPage.test.tsx
          tests/pages/students/StudentsPage.test.tsx
          tests/pages/home/HomePage.test.tsx
