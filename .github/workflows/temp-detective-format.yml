name: Format detective lesson (temporary)
on:
  push:
    branches: [feature/irregular-verbs-mascot-mystery]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/lesson/PastSimpleDetectiveLesson.tsx src/pages/lesson/PastSimpleDetectiveLesson.css src/pages/lesson/LessonPage.tsx src/content/lessons/grade-6/irregular-verbs-mascot-mystery/lesson.json tests/pages/lesson/PastSimpleDetectiveLesson.test.tsx tests/browser/past-simple-detective.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/lesson/PastSimpleDetectiveLesson.tsx src/pages/lesson/PastSimpleDetectiveLesson.css src/pages/lesson/LessonPage.tsx src/content/lessons/grade-6/irregular-verbs-mascot-mystery/lesson.json tests/pages/lesson/PastSimpleDetectiveLesson.test.tsx tests/browser/past-simple-detective.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format detective lesson"
            git push
          fi
