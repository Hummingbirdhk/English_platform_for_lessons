name: Format homework download temporary
on:
  push:
    branches: [feature/homework-submissions-storage]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/shared/lib/homeworkSubmissions.ts src/pages/teacher/StudentHomeworkReview.tsx src/pages/teacher/studentHomeworkReview.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/lib/homeworkSubmissions.ts src/pages/teacher/StudentHomeworkReview.tsx src/pages/teacher/studentHomeworkReview.css
          if ! git diff --cached --quiet; then
            git commit -m "Format homework download controls"
            git push
          fi
