name: Format rich grammar

on:
  push:
    branches:
      - feat/rich-grammar-studio

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rich-grammar-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/content/grammar/grammarPresentations.ts src/content/materials/grammar/plural-nouns.json src/content/materials/grammar/object-pronouns.json src/entities/material/renderers/GrammarMaterial.tsx src/entities/material/MaterialCard.tsx src/pages/materials/MaterialsPage.tsx src/styles.css tests/content/grammar-presentations.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: format rich grammar studio"
          git push
