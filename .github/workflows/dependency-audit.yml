name: Dependency audit

on:
  push:
    branches:
      - chore/dependency-security

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json || true
