name: Dependency security diagnostics

on:
  push:
    branches:
      - chore/dependency-security

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - name: Rebuild candidate dependency tree
        shell: bash
        run: |
          npm pkg set "devDependencies.vitest=^4.1.12"
          npm install
          echo "=== npm config omit ==="
          npm config get omit
          echo "=== direct package declarations ==="
          node -e "const p=require('./package.json'); console.log({vitest:p.devDependencies.vitest,nodeTypes:p.devDependencies['@types/node']})"
          echo "=== installed tree ==="
          npm ls vitest tinypool @vitest/mocker @types/node --all || true
          echo "=== lock entries ==="
          node -e "const l=require('./package-lock.json'); for (const k of ['node_modules/vitest','node_modules/tinypool','node_modules/@vitest/mocker','node_modules/@types/node']) console.log(k,l.packages[k]?.version,l.packages[k]?.dev)"
          echo "=== audit ==="
          npm audit --json || true
