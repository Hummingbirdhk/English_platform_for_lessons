name: Format glossy action branch

on:
  push:
    branches:
      - feature/glossy-action-buttons

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/home/HomePage.tsx src/shared/ui/GlossyActionButton.tsx tests/shared/ui/GlossyActionButton.test.tsx
      - name: Commit formatting if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/home/HomePage.tsx src/shared/ui/GlossyActionButton.tsx tests/shared/ui/GlossyActionButton.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format glossy action controls"
            git push
          fi
