name: Format student workspace

on:
  push:
    branches:
      - feat/student-workspace-management

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/student-workspace-management
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/app/routing/routes.tsx src/features/student-workspace/StudentAssignmentBar.tsx src/pages/teacher/StudentPreparationPage.tsx src/pages/teacher/TeacherDashboardPage.tsx src/styles.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/routing/routes.tsx src/features/student-workspace/StudentAssignmentBar.tsx src/pages/teacher/StudentPreparationPage.tsx src/pages/teacher/TeacherDashboardPage.tsx src/styles.css
          git commit -m "style: format student workspace"
          git push
