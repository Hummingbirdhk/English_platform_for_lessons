name: Format vocabulary fix

on:
  push:
    branches:
      - fix/vocabulary-feedback-and-student-schedule

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vocabulary-feedback-and-student-schedule
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write public/interactive/vocabulary-modules-1-2.v3.html
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/interactive/vocabulary-modules-1-2.v3.html
          git commit -m "style: format vocabulary v3 asset"
          git push
