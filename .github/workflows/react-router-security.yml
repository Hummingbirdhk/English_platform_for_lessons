name: Generate React Router security lockfile

on:
  push:
    branches:
      - chore/react-router-security

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11
      - name: Upgrade React Router
        shell: bash
        run: |
          npm pkg set "dependencies.react-router-dom=^7.18.4"
          npm install
          echo "=== router versions ==="
          npm ls react-router react-router-dom --all
          echo "=== audit ==="
          npm audit --json || true
      - name: Commit dependency update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: upgrade React Router security baseline"
            git push
          fi
