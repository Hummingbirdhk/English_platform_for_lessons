name: Format family vocabulary (temporary)
on:
  push:
    branches: [feature/interactive-family-vocabulary]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/entities/material/renderers/FamilyVocabulary.tsx src/entities/material/renderers/familyVocabulary.css src/entities/material/MaterialRenderer.tsx src/content/loadContent.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/entities/material/renderers/FamilyVocabulary.tsx src/entities/material/renderers/familyVocabulary.css src/entities/material/MaterialRenderer.tsx src/content/loadContent.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format family vocabulary"
            git push
          fi
