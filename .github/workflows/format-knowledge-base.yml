name: Format knowledge base branch

on:
  push:
    branches:
      - content/a2-b1-knowledge-base

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/knowledge src/content/validate-cli.ts src/content/validateKnowledge.ts src/content/schema/knowledgeSchema.ts tests/content/knowledge-validation.test.ts rules/CONTENT_SCHEMA.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format knowledge base"
            git push
          fi
