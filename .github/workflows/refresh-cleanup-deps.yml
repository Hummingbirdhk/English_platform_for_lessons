name: Refresh cleanup dependencies

on:
  push:
    branches:
      - chore/repository-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/repository-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh dev tooling
        run: |
          npm install --save-dev --save-exact eslint@10.13.0 @eslint/js@10.0.1 typescript-eslint@8.72.0 eslint-plugin-react-hooks@7.1.1 eslint-plugin-react-refresh@0.5.7 jsdom@30.1.3
          npm pkg set overrides.fast-uri=3.1.9
          npm install
      - run: npm audit --audit-level=moderate
      - run: npm run verify
      - name: Commit dependency refresh
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh dev tooling and security lock"
          git push
