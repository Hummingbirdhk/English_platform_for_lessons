name: Temporary mobile formatting
on:
  push:
    branches:
      - design/mobile-responsive-ux
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/mobile.css src/main.tsx src/shared/ui/AppShell.tsx tests/browser/mobile-responsive.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobile.css src/main.tsx src/shared/ui/AppShell.tsx tests/browser/mobile-responsive.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format mobile responsive updates"
            git push
          fi
