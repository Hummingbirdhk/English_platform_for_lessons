name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_CLOUD_ENDPOINT: ${{ vars.CLOUD_ENDPOINT }}
      VITE_CLOUD_PUBLIC_TOKEN: ${{ vars.CLOUD_CLIENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
