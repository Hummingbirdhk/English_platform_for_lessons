name: Format family design temporary
on:
  push:
    branches: [design/family-vocabulary-v1]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/entities/material/renderers/FamilyPortrait.tsx src/entities/material/renderers/FamilyVocabulary.tsx src/entities/material/renderers/familyVocabulary.css
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/entities/material/renderers/FamilyPortrait.tsx src/entities/material/renderers/FamilyVocabulary.tsx src/entities/material/renderers/familyVocabulary.css
          if ! git diff --cached --quiet; then
            git commit -m "Format family design"
            git push
          fi
