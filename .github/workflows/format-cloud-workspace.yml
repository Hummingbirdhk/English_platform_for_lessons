name: Format cloud workspace

on:
  push:
    branches:
      - feat/supabase-cloud-workspace

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/supabase-cloud-workspace
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/features/student-workspace/studentWorkspaceCloud.ts src/shared/lib/cloudClient.ts src/styles.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/student-workspace/studentWorkspaceCloud.ts src/shared/lib/cloudClient.ts src/styles.css
          git commit -m "style: format cloud workspace"
          git push
