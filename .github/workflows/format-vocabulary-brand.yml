name: Format vocabulary brand

on:
  push:
    branches:
      - style/vocabulary-lesson-brand

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/vocabulary-lesson-brand
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write public/interactive/vocabulary-modules-1-2.html
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/interactive/vocabulary-modules-1-2.html
          git commit -m "style: format vocabulary lesson brand update"
          git push
