name: Format detective test (temporary)
on:
  push:
    branches: [feature/irregular-verbs-mascot-mystery]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/pages/lesson/PastSimpleDetectiveLesson.test.tsx
      - name: Save formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pages/lesson/PastSimpleDetectiveLesson.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format detective test"
            git push
          fi
