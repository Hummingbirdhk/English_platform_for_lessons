name: QA setup and formatting (temporary)
on:
  push:
    branches:
      - qa/import-reference-harness
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npx prettier --write package.json playwright.config.ts tests/browser tools/qa AGENTS.md README.md
      - name: Commit package lock and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json playwright.config.ts tests/browser tools/qa AGENTS.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "Sync QA lockfile and formatting"
            git push
          fi
