name: Format reading library (temporary)
on:
  push:
    branches:
      - feature/reading-library-20
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/content/reading/readingTexts.ts src/pages/materials/MaterialsPage.tsx src/pages/reading/readingLibrary.css src/pages/reading/ReadingLibraryPage.tsx src/pages/students/StudentOwnPage.tsx src/pages/students/StudentPage.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/reading/readingTexts.ts src/pages/materials/MaterialsPage.tsx src/pages/reading/readingLibrary.css src/pages/reading/ReadingLibraryPage.tsx src/pages/students/StudentOwnPage.tsx src/pages/students/StudentPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to reading library"
            git push
          fi
