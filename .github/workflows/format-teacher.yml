name: Format teacher dashboard

on:
  push:
    branches:
      - feat/teacher-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/teacher-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/pages/teacher/TeacherDashboardPage.tsx src/styles.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/teacher/TeacherDashboardPage.tsx src/styles.css
          git commit -m "style: format teacher dashboard"
          git push
