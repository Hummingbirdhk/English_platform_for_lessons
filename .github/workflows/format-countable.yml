name: Format countable guide

on:
  push:
    branches:
      - feat/countable-uncountable-guide

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/countable-uncountable-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/content/grammar/grammarPresentations.ts src/styles.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/grammar/grammarPresentations.ts src/styles.css
          git commit -m "style: format countable guide"
          git push
