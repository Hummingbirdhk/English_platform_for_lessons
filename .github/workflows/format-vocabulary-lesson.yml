name: Format vocabulary lesson

on:
  push:
    branches:
      - feat/vocabulary-lesson-modules-1-2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vocabulary-lesson-modules-1-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write public/interactive/vocabulary-modules-1-2.html src/styles.css tests/content/vocabulary-modules-1-2-lesson.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/interactive/vocabulary-modules-1-2.html src/styles.css tests/content/vocabulary-modules-1-2-lesson.test.ts
          git commit -m "style: format vocabulary lesson"
          git push
